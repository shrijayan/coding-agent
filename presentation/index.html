<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Optimizing LLM-Powered Applications &middot; XConf 2026</title>

  <!-- Vendored reveal.js (offline) -->
  <link rel="stylesheet" href="vendor/reveal/reset.css" />
  <link rel="stylesheet" href="vendor/reveal/reveal.css" />

  <!-- Vendored fonts (offline) -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />

  <!-- ThoughtWorks brand theme + modular layer stylesheets -->
  <link rel="stylesheet" href="css/theme-thoughtworks.css" />
  <link rel="stylesheet" href="css/layouts.css" />
  <link rel="stylesheet" href="css/hud.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <!-- =============================== persistent brand chrome (every slide) -->
  <div class="deck-brand">
    <img class="tw-img light" src="assets/tw-logo.svg" alt="Thoughtworks" />
    <img class="tw-img dark" src="assets/tw-logo-white.svg" alt="Thoughtworks" />
  </div>
  <div class="deck-xconf">
    <img class="xconf-img light" src="assets/xconf-logo.svg" alt="XConf" />
    <img class="xconf-img dark" src="assets/xconf-logo-white.svg" alt="XConf" />
  </div>
  <div class="deck-footer">
    <span>&copy; 2026 Thoughtworks</span>
    <span class="sep">|</span>
    <span>XConf 2026 &middot; Optimizing LLM-Powered Applications</span>
  </div>

  <!-- =========================================== the always-on token/cost HUD -->
  <div id="hud" class="hud is-hidden" aria-label="Live token and cost meter">
    <div class="hud-stat tokens">
      <div class="hud-label"><span class="k"></span>Context tokens</div>
      <div class="hud-value"><span class="num">0</span></div>
      <div class="hud-delta"></div>
    </div>
    <div class="hud-div"></div>
    <div class="hud-stat cost">
      <div class="hud-label"><span class="k"></span>Session cost</div>
      <div class="hud-value"><span class="cur">$</span><span class="num">0.0000</span></div>
      <div class="hud-delta"></div>
    </div>
  </div>
  <div id="hud-hint" class="hud-hint"></div>

  <!-- ============================================ reveal mounts slides here -->
  <div class="reveal">
    <div class="slides"><!-- slides are injected by js/deck.js --></div>
  </div>

  <!-- ================================================================ scripts -->
  <script src="vendor/reveal/reveal.js"></script>
  <script src="vendor/reveal/plugin/notes/notes.js"></script>

  <!-- engine (must load before slides) -->
  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/deck.js"></script>

  <!-- slides: order here IS the deck order. Reorder / add / remove freely. -->
  <script src="slides/00-intro.js"></script>
  <script src="slides/10-base-agent.js"></script>
  <script src="slides/20-summarization.js"></script>
  <script src="slides/30-prompt-caching.js"></script>
  <script src="slides/35-cache-friendly-prompts.js"></script>
  <script src="slides/40-routing.js"></script>
  <script src="slides/45-loop-prevention.js"></script>
  <script src="slides/50-context-pruning.js"></script>
  <script src="slides/55-context-skills.js"></script>
  <script src="slides/90-closing.js"></script>

  <!-- everything registered -> build once -->
  <script>Deck.build();</script>
</body>
</html>
