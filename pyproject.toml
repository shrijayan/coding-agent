[project]
name = "coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shrijayan", email = "81805145+shrijayan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Extras used only by the workshop notebook (notebooks/optimizing_llm_apps.ipynb)
# to render its comparison tables and charts. Kept here - not hardcoded in the
# notebook - so the notebook installs everything it needs straight from this
# manifest (`pip install -e ".[notebook]"`) and never has to be edited when the
# project's dependencies change.
notebook = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
coding-agent = "coding_agent:main"

[dependency-groups]
# Dev-only tooling, not runtime deps: the test suite (tests/) and the
# linter the hybrid-routing quality gate can optionally shell out to.
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
