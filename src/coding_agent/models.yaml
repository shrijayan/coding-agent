# The single source of truth for WHICH models this agent uses, what they
# cost, what they're good at, and how the hybrid-routing ladder is built.
#
# Everything about models lives here (plain data, not Python) so swapping a
# model, re-pricing it, or reordering the routing ladder is a one-line edit
# with no code change. Secrets never live here - API keys stay in .env.
#
# Four sections:
#   default          - what the base agent uses when routing is OFF
#   session_cost_cap - the per-session spend guardrail (protects the budget)
#   models           - the catalog: price + metadata for every model named
#                      anywhere in this file (base default AND every tier)
#   routing          - the hybrid-routing ladder (cheapest first) + settings
#
# Prices are USD per 1,000,000 tokens, hand-maintained. Every model string
# used anywhere below MUST have a `models:` entry - the agent refuses to
# start otherwise, rather than silently showing $0.00 for an unpriced model.

# ---------------------------------------------------------------------------
# Base agent defaults (used when you run WITHOUT --enable hybrid-routing).
# AGENT_PROVIDER / AGENT_MODEL / AGENT_MAX_TOKENS in .env override these if
# set, so an individual can point at their own model without editing this
# shared file - but the workshop default is what's here.
# ---------------------------------------------------------------------------
default:
  provider: openrouter
  model: thinkingmachines/inkling-small
  max_tokens: 4096

# ---------------------------------------------------------------------------
# Session spend guardrail. The agent stops making LLM calls once a session's
# estimated cost crosses this many USD, then tells the user. This is what
# keeps a shared, fixed token budget safe across many participants: with a
# $1.00 cap, N participants can cost at most ~$N no matter how hard anyone
# hammers the expensive tier. Set to null to disable the cap entirely.
# ---------------------------------------------------------------------------
session_cost_cap_usd: 1.00

# ---------------------------------------------------------------------------
# The model catalog. `metadata` is context for humans reading /usage and for
# the pre-routing phase to reason about later - it is NOT yet consumed by the
# router (routing decides purely on difficulty_ceiling below), but it's
# stored here so that capability-aware routing is a code change away, not a
# data-gathering exercise.
# ---------------------------------------------------------------------------
models:
  # --- OpenRouter routing ladder (cheap -> high), prices as listed on
  #     openrouter.ai. These three are the workshop ladder. ---
  deepseek/deepseek-v4-flash-0731:
    provider: openrouter
    input_per_million_usd: 0.09
    output_per_million_usd: 0.18
    metadata:
      description: >-
        Sparse MoE (13B active / 284B total) tuned for coding, reasoning,
        and agent workflows. The cheap workhorse that should answer the
        bulk of easy/routine requests.
      context_window: 1050000
      strengths: [low_cost, fast, routine_edits, boilerplate]
      good_for_difficulty: [easy]

  thinkingmachines/inkling-small:
    provider: openrouter
    input_per_million_usd: 0.45
    output_per_million_usd: 1.20
    metadata:
      description: >-
        Open-weight multimodal MoE (12B active / 276B total). A balanced
        mid tier for multi-step reasoning, debugging, and agentic tool use
        that the cheap tier struggles with.
      context_window: 524000
      strengths: [reasoning, debugging, tool_use, refactoring]
      good_for_difficulty: [medium]

  qwen/qwen3.8-max:
    provider: openrouter
    input_per_million_usd: 2.00
    output_per_million_usd: 6.00
    metadata:
      description: >-
        Flagship Qwen reasoning model. The strong tier reserved for the
        hardest requests - architecture, tricky concurrency/algorithms,
        deep debugging - where a wrong cheap answer costs more than the
        model does.
      context_window: 1000000
      strengths: [architecture, hard_debugging, algorithms, long_context]
      good_for_difficulty: [hard]

  # --- Kept for compatibility with non-workshop setups (direct Anthropic,
  #     local Ollama). Not part of the default ladder. ---
  claude-sonnet-5:
    provider: anthropic
    # Anthropic introductory rate ($2 in / $10 out), valid through
    # 2026-08-31. After that the standard rate is $3 in / $15 out - update
    # both claude-sonnet-5 entries when it lapses. See
    # https://docs.claude.com/en/docs/about-claude/pricing
    input_per_million_usd: 2.00
    output_per_million_usd: 10.00
    metadata:
      description: Frontier Anthropic model, used when AGENT_PROVIDER=anthropic.
      context_window: 200000
      strengths: [reasoning, architecture, long_context]
      good_for_difficulty: [hard]

  anthropic/claude-sonnet-5:
    provider: openrouter
    # Same model reached via OpenRouter - separate entry because the slug
    # differs and per-route pricing can differ too.
    input_per_million_usd: 2.00
    output_per_million_usd: 10.00
    metadata:
      description: Claude Sonnet 5 via OpenRouter's slug.
      context_window: 200000
      strengths: [reasoning, architecture, long_context]
      good_for_difficulty: [hard]

  ollama/qwen2.5-coder:7b:
    provider: ollama
    # Local models are free, but still need an entry so cost math and the
    # startup pricing check work.
    input_per_million_usd: 0.00
    output_per_million_usd: 0.00
    metadata:
      description: Local Qwen coder via Ollama - free, for offline/dev use.
      context_window: 32768
      strengths: [free, offline, code_generation]
      good_for_difficulty: [easy]

# ---------------------------------------------------------------------------
# The hybrid-routing ladder, ordered cheapest/weakest FIRST to strongest
# LAST. Only used with `--enable hybrid-routing`.
#
# ROUTING: a request is scored 0.0-1.0 for difficulty and starts at the
# FIRST tier whose difficulty_ceiling >= that score, so cheap tiers are
# skipped for hard requests.
# CASCADE: if a tier's output fails the quality gate, it escalates one step
# up the ladder and retries, until the gate passes or the ladder runs out.
#
# Each tier: name (label shown in /metrics), model (must exist in `models:`
# above), and difficulty_ceiling. provider defaults to the model's catalog
# provider; set `provider: inner` (with no model) for a tier that reuses
# AGENT_PROVIDER/AGENT_MODEL instead. The last tier's difficulty_ceiling
# MUST be 1.0 (the catch-all nothing escalates past). Tiers whose API key
# isn't set are skipped automatically at startup with a warning.
# ---------------------------------------------------------------------------
routing:
  quality_gate_enabled: true
  ollama_base_url: http://localhost:11434/v1
  tiers:
    - name: cheap
      model: deepseek/deepseek-v4-flash-0731
      difficulty_ceiling: 0.45
    - name: mid
      model: thinkingmachines/inkling-small
      difficulty_ceiling: 0.75
    - name: high
      model: qwen/qwen3.8-max
      difficulty_ceiling: 1.0
